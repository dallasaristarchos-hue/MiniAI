name: Build MiniAI Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build installable debug APK for testing
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Prepare signed Play upload key (if configured)
        env:
          MINIAI_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MINIAI_UPLOAD_KEYSTORE_BASE64 }}
          MINIAI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MINIAI_UPLOAD_KEYSTORE_PASSWORD }}
          MINIAI_UPLOAD_KEY_ALIAS: ${{ secrets.MINIAI_UPLOAD_KEY_ALIAS }}
          MINIAI_UPLOAD_KEY_PASSWORD: ${{ secrets.MINIAI_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$MINIAI_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$MINIAI_UPLOAD_KEYSTORE_PASSWORD" ] && [ -n "$MINIAI_UPLOAD_KEY_ALIAS" ] && [ -n "$MINIAI_UPLOAD_KEY_PASSWORD" ]; then
            echo "$MINIAI_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "MINIAI_UPLOAD_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "PLAY_BUNDLE_READY=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_BUNDLE_READY=false" >> "$GITHUB_ENV"
            echo "::notice::Signed Play bundle skipped. Configure the four MINIAI_UPLOAD_* repository secrets when the release key is ready."
          fi
      - name: Build signed Google Play App Bundle
        if: env.PLAY_BUNDLE_READY == 'true'
        working-directory: android
        env:
          MINIAI_UPLOAD_KEYSTORE_PATH: ${{ env.MINIAI_UPLOAD_KEYSTORE_PATH }}
          MINIAI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MINIAI_UPLOAD_KEYSTORE_PASSWORD }}
          MINIAI_UPLOAD_KEY_ALIAS: ${{ secrets.MINIAI_UPLOAD_KEY_ALIAS }}
          MINIAI_UPLOAD_KEY_PASSWORD: ${{ secrets.MINIAI_UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon
      - name: Collect release files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MiniAI.apk
          RELEASE_FILES="MiniAI.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab MiniAI-Play.aab
            RELEASE_FILES="$RELEASE_FILES\nMiniAI-Play.aab"
          fi
          printf "RELEASE_FILES=%b\n" "$RELEASE_FILES" >> "$GITHUB_ENV"
          rm -f android/upload-keystore.jks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: miniai-v2.3.${{ github.run_number }}
          name: MiniAI Android v2.3.${{ github.run_number }}
          files: ${{ env.RELEASE_FILES }}
          make_latest: true
          generate_release_notes: true
