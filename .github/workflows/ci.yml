name: MiniAI CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: miniai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check browser script syntax
        run: node --check script.js
      - name: Check workspace script syntax
        run: node --check workspace.js
      - name: Run automated tests
        run: node --test tests/*.test.mjs
