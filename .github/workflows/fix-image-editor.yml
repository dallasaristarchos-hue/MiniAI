name: Fix MiniAI image editor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified image editor fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          q = chr(34)
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          p = Path("worker.js")
          s = p.read_text()
          require('You improve instructions for an image-editing model.' in s, "Edit prompt source not found")
          s = s.replace('let imageB64 = ' + q + q + ';', 'let imageB64 = ' + q + q + ';\n      let imageMime = ' + q + 'image/jpeg' + q + ';', 1)
          s = s.replace('You improve instructions for an image-editing model.', "You are a faithful image-editing instruction interpreter. Follow the user's requested changes exactly and make no other changes. Preserve the original image, subjects, identities, facial features, pose, framing, composition, background, colors, and all unmentioned details. Do not add, remove, replace, beautify, stylize, crop, or rearrange anything unless explicitly requested. If the user asks for one specific change, make only that change. Keep exact requested text and spelling. Resolve typos from context without changing the intended meaning.", 1)
          pattern = r'const width = Math.max\(256, Math.min\(768,.*?seed: Math.floor\(Math.random\(\) \* 2147483647\)\s*\}\);'
          replacement = '''// FLUX.2 Klein accepts reference images as multipart binary fields.
                    // Its reference-image inputs must be smaller than 512x512.
                    const width = Math.max(256, Math.min(1920, Math.round(Number(body.width) || 1024)));
                    const height = Math.max(256, Math.min(1920, Math.round(Number(body.height) || 1024)));
                    const imageBytes = Uint8Array.from(atob(imageB64), character => character.charCodeAt(0));
                    const form = new FormData();
                    form.append("prompt", imagePrompt.slice(0, 4096));
                    form.append("input_image_0", new Blob([imageBytes], { type: imageMime }), "reference-image");
                    form.append("width", String(width));
                    form.append("height", String(height));
                    const multipart = new Response(form);
                    result = await env.AI.run("@cf/black-forest-labs/flux-2-klein-4b", {
                      multipart: { body: multipart.body, contentType: multipart.headers.get("content-type") }
                    });'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          require(count == 1, "Old image-edit model block not found")
          p.write_text(s)
          p = Path("script.js")
          s = p.read_text()
          s = s.replace(',[' + q + 'photoStrength' + q + ',' + q + 'strengthValue' + q + ',' + q + '%' + q + ']', '', 1)
          s = s.replace('const scale=Math.min(768/Math.max(sourceWidth,sourceHeight),Math.max(256/sourceWidth,256/sourceHeight));', 'const scale=Math.min(448/Math.max(sourceWidth,sourceHeight),1);', 1)
          s = s.replace('Math.max(256,Math.round(sourceWidth*scale))', 'Math.max(1,Math.round(sourceWidth*scale))', 1)
          s = s.replace('Math.max(256,Math.round(sourceHeight*scale))', 'Math.max(1,Math.round(sourceHeight*scale))', 1)
          s = s.replace('payload.strength=Number($(' + q + '#photoStrength' + q + ').value)/100;', 'payload.width=1024;payload.height=1024;', 1)
          require('const scale=Math.min(448/' in s and 'payload.width=1024;payload.height=1024;' in s, "Frontend image input update failed")
          p.write_text(s)
          p = Path("index.html")
          s = p.read_text()
          pattern = r'<label class=' + q + r'studio-label' + q + r' for=' + q + 'photoStrength' + q + r'>.*?<small class=' + q + r'studio-hint' + q + r'>.*?</small>'
          s, count = re.subn(pattern, '', s, count=1, flags=re.S)
          require(count == 1, "Obsolete edit-strength control not found")
          p.write_text(s)
          PY
          node --check worker.js
          node --check script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js script.js index.html
          git commit -m "Fix image editor with FLUX.2 reference editing"
          git push
