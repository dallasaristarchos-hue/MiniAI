name: Finish MiniAI image editor output sizing
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve the uploaded photo aspect ratio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("script.js")
          s = p.read_text()
          old = "payload.width=photo.width;payload.height=photo.height;payload.width=1024;payload.height=1024;"
          new = "payload.width=Math.max(256,photo.width*2);payload.height=Math.max(256,photo.height*2);"
          if old not in s:
              raise SystemExit("Expected image edit sizing line not found")
          p.write_text(s.replace(old, new, 1))
          PY
          node --check script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix image editor output aspect ratio"
          git push
